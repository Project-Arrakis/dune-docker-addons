name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  validate-json:
    name: Validate JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Validate index.json
        run: |
          python3 -c "import json; json.load(open('index.json'))" || { echo "Invalid JSON"; exit 1; }
      - name: Validate addon JSON files
        run: |
          find addons -name "*.json" -exec python3 -c "import json,sys; json.load(open(sys.argv[1]))" {} \; || { echo "Invalid JSON found"; exit 1; }

  # gitleaks split into its own job below (calling the org-shared
  # reusable-security-scan.yml) -- it used gitleaks/gitleaks-action,
  # which started requiring a paid org-account license this session (the
  # GITLEAKS_LICENSE env wiring added earlier today is now superseded,
  # not needed with the shared workflow's raw CLI approach). semgrep
  # stays here: this repo deliberately uses p/security-audit only
  # (no p/default/p/secrets), different from the shared workflow's fixed
  # ruleset, and runs via a pinned Docker image rather than pip install.
  gitleaks:
    uses: Project-Arrakis/.github/.github/workflows/reusable-security-scan.yml@main
    with:
      run-semgrep: false
      run-trivy: false
    secrets:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      # returntocorp/semgrep-action (and its semgrep/semgrep-action
      # successor) are both explicitly marked deprecated by their own
      # READMEs ("stop using this wrapper script... migrate to native
      # Semgrep support instead"). Running the semgrep CLI directly via
      # its official Docker image is the current recommended approach.
      # Image pinned by digest (not :latest) so a compromised or broken
      # upstream tag can't silently change what this job pulls.
      - name: Run semgrep
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" \
            semgrep/semgrep@sha256:67319956da3dcb58baf5b322899c15458e3963e7018a86aeeb5cd224e69cb77a \
            semgrep --config p/security-audit --error /src

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [validate-json, security, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - name: Require every check to pass
        env:
          JSON: ${{ needs.validate-json.result }}
          SECURITY: ${{ needs.security.result }}
          GITLEAKS: ${{ needs.gitleaks.result }}
        run: |
          set -euo pipefail
          failed=0
          for result in "$JSON" "$SECURITY" "$GITLEAKS"; do
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "One or more required checks did not pass."
            exit 1
          fi
          echo "All required checks passed."
